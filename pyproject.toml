[project]
name = "practice-tdd"
version = "0.1.0"
description = "Exercises to practice TDD in Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "py-money>=0.5.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"
